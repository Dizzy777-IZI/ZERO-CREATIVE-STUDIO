name: ZERO Router Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and dependencies
        run: python -m pip install -e .
      - name: Run routing policy tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run Cloudflare Worker tests
        run: node --test tests/cloudflare-worker.test.mjs
      - name: Set up Node.js for Wrangler validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Worker bundle without deploying
        run: npm run deploy -- --dry-run
