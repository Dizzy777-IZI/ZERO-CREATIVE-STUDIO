name: PROJECT IZI Bybit Read-only Tests

on:
  push:
    branches: ["feature/izi-bybit-readonly-audit"]
    paths:
      - "src/izi_bybit/**"
      - "tests/test_bybit_readonly.py"
      - "pyproject.toml"
      - ".github/workflows/izi-bybit-readonly.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/izi_bybit/**"
      - "tests/test_bybit_readonly.py"
      - "pyproject.toml"
      - ".github/workflows/izi-bybit-readonly.yml"

permissions:
  contents: read

jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project with official Bybit connector
        run: python -m pip install -e ".[bybit-readonly]"
      - name: Run read-only adapter tests (no live API calls)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_bybit_readonly.py" -v
